# PurseString policy. Every purchase an agent makes is checked against these rules.
# Decision order: any "deny" rule fails -> denied. Any other rule fails -> paused for a human.
# Everything passes -> auto-approved and a single-use card is issued.
version: 1
currency: USD

vendors:
  # Where agents may buy without asking. "*.example.com" also matches subdomains.
  allowlist:
    - openai.com
    - anthropic.com
    - "*.github.com"
    - pdfocr.io
  # Never, even with approval.
  blocklist:
    - "*.casino"
    - giftcards.com

auto_approve:
  max_amount: 20                  # strictly under this, one-time, allowlisted -> no human needed
  require_allowlisted_vendor: true
  allow_recurring: false

require_approval:
  over_amount: 50                 # anything above always goes to a human
  recurring: true                 # subscriptions and auto-renewing trials always go to a human
  non_allowlisted_vendor: true

hard_limits:
  max_amount: 1000                # refused outright, nobody can approve it
  per_agent_daily_budget: 200     # past this, every spend needs a human

intent:
  require_alternatives: true      # agent must say what free options it tried first
  min_goal_length: 15

idempotency:
  window_minutes: 30              # same agent + task + vendor + amount inside this window = same purchase

approvals:
  ttl_minutes: 1440               # pending or approved intents expire after a day

notifications:
  # Or set SLACK_WEBHOOK_URL / DISCORD_WEBHOOK_URL in the environment.
  # slack_webhook_url: https://hooks.slack.com/services/...
  # discord_webhook_url: https://discord.com/api/webhooks/...

adapter:
  # The default rail. mock | lithic | privacy | airwallex work today; highnote | marqeta | amex | network_token | ach are planned.
  # LITHIC_API_KEY in the env switches the default to lithic automatically.
  type: mock
  lithic:
    environment: sandbox
  airwallex:
    environment: sandbox          # sandbox is Airwallex's demo environment
    # cardholder_id: ...          # or AIRWALLEX_CARDHOLDER_ID; agent cards are issued to this cardholder

# Pick a rail per purchase. First match wins; no match uses adapter.type.
routes: []
#  - rail: ach                     # big B2B invoices where cards aren't accepted
#    min_amount: 1000
#  - rail: amex                    # spend on the company's corporate Amex line
#    vendors: ["*.salesforce.com"]
#  - rail: lithic                  # everything else under $500 on BaaS virtual cards
#    max_amount: 500

cards:
  ttl_minutes: 10                 # single-use cards close this long after issue; subscriptions don't expire

jit:
  # Real-time authorization: the issuer asks "merchant X wants $45 on this card, approve?"
  # PurseString approves only charges that match the approved intent. Needs LITHIC_WEBHOOK_SECRET for Lithic.
  enabled: true
  tolerance_percent: 0            # allow this much over the approved amount (tax, FX)
  require_merchant_match: false   # decline when the merchant descriptor doesn't mention the vendor
