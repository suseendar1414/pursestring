# PurseString policy. Every purchase an agent makes is checked against these rules.
# Decision order: any "deny" rule fails -> denied. Any other rule fails -> paused for a human.
# Everything passes -> auto-approved and a single-use card is issued.
version: 1
currency: USD

vendors:
  # Where agents may buy without asking. "*.example.com" also matches subdomains.
  allowlist:
    - openai.com
    - anthropic.com
    - "*.github.com"
    - pdfocr.io
  # Never, even with approval.
  blocklist:
    - "*.casino"
    - giftcards.com

auto_approve:
  max_amount: 20                  # strictly under this, one-time, allowlisted -> no human needed
  require_allowlisted_vendor: true
  allow_recurring: false

require_approval:
  over_amount: 50                 # anything above always goes to a human
  recurring: true                 # subscriptions and auto-renewing trials always go to a human
  non_allowlisted_vendor: true

hard_limits:
  max_amount: 1000                # refused outright, nobody can approve it
  per_agent_daily_budget: 200     # past this, every spend needs a human

intent:
  require_alternatives: true      # agent must say what free options it tried first
  min_goal_length: 15

idempotency:
  window_minutes: 30              # same agent + task + vendor + amount inside this window = same purchase

approvals:
  ttl_minutes: 1440               # pending or approved intents expire after a day
  # `pursestring approve` needs the one-time code sent to Slack/Discord, so an agent with a shell
  # can't approve its own purchase. Default: on whenever Slack or Discord is configured.
  # require_code: true
  slack_approvers: []             # Slack user IDs (U0123...) allowed to press Approve; empty = anyone in the channel

notifications:
  # Or set SLACK_WEBHOOK_URL / DISCORD_WEBHOOK_URL in the environment.
  # slack_webhook_url: https://hooks.slack.com/services/...
  # discord_webhook_url: https://discord.com/api/webhooks/...

adapter:
  # The default rail. mock | lithic | privacy | airwallex | paypal work today; highnote | marqeta | amex | network_token | ach are planned.
  # LITHIC_API_KEY (or else PAYPAL_CLIENT_ID) in the env switches the default to that rail automatically.
  type: mock
  lithic:
    environment: sandbox
  airwallex:
    environment: sandbox          # sandbox is Airwallex's demo environment
    # cardholder_id: ...          # or AIRWALLEX_CARDHOLDER_ID; agent cards are issued to this cardholder
  paypal:
    environment: sandbox          # api-m.sandbox.paypal.com; no real money
  stripe_connect:
    environment: sandbox          # only test-mode keys (sk_test_) are accepted
  razorpayx:
    environment: sandbox          # only test-mode keys (rzp_test_) are accepted
    mode: IMPS                    # IMPS | NEFT | RTGS | UPI
  modern_treasury:
    payment_type: ach             # ach | wire | rtp | ...

# Where payout rails (paypal, stripe_connect, razorpayx, modern_treasury) send money for each vendor. The agent never picks the recipient,
# so a vendor with no entry here can't be paid by payout. See docs/paypal.md.
payees: []
#  - vendor: pdfocr.io
#    receiver: billing@pdfocr.io   # PayPal email, phone or PayPal account ID
#    type: EMAIL                   # EMAIL | PHONE | PAYPAL_ID
#    wallet: PAYPAL                # PAYPAL | VENMO (Venmo pays to a US phone number)
#  - vendor: pdfocr.io
#    stripe_account: acct_123      # stripe_connect: the vendor's connected account
#  - vendor: gstfiling.in
#    razorpayx_fund_account: fa_123  # razorpayx: the vendor's fund account
#  - vendor: acme-supplies.com
#    modern_treasury_account: ea_id  # modern_treasury: the vendor's external account ID

# Run PayPal's own MCP server (@paypal/mcp) behind PurseString. Read-only tools pass through;
# refunds, dispute acceptance and cancellations go through policy first. See docs/paypal.md.
paypal_tools:
  enabled: false                  # needs PAYPAL_CLIENT_ID and PAYPAL_CLIENT_SECRET
  refunds:
    auto_approve_under: 25        # smaller refunds run without a human
    max_amount: 500               # bigger refunds are refused outright
  require_approval: [accept_dispute_claim, cancel_subscription, cancel_sent_invoice, update_subscription]
  deny: []

# Pick a rail per purchase. First match wins; no match uses adapter.type.
routes: []
#  - rail: ach                     # big B2B invoices where cards aren't accepted
#    min_amount: 1000
#  - rail: amex                    # spend on the company's corporate Amex line
#    vendors: ["*.salesforce.com"]
#  - rail: paypal                  # vendors who invoice through PayPal get paid straight to their account
#    vendors: ["pdfocr.io"]
#  - rail: lithic                  # everything else under $500 on BaaS virtual cards
#    max_amount: 500

cards:
  ttl_minutes: 10                 # single-use cards close this long after issue; subscriptions don't expire

jit:
  # Real-time authorization: the issuer asks "merchant X wants $45 on this card, approve?"
  # PurseString approves only charges that match the approved intent. Needs LITHIC_WEBHOOK_SECRET for Lithic.
  enabled: true
  tolerance_percent: 0            # allow this much over the approved amount (tax, FX)
  require_merchant_match: true    # decline when the merchant descriptor doesn't mention the vendor

# Kill switch: `pursestring halt [--agent id]` stops spending at once. Loop detection pulls it by itself
# when an agent keeps asking for the same purchase under new task IDs. See docs/policies.md.
kill_switch:
  loop_detection:
    enabled: true
    window_minutes: 10
    max_similar: 5                # the 5th near-identical intent in 10 minutes halts the agent
    amount_tolerance_percent: 10

# Pay for HTTP APIs that charge per request with 402 Payment Required (x402), in USDC from the wallet in
# X402_PRIVATE_KEY. Each payment is a purchase intent under this same policy. See docs/x402.md.
x402:
  enabled: false
  networks: ["eip155:84532"]      # Base Sepolia testnet; add "eip155:8453" for Base (real USDC)
  pay_to: []                      # optional pins: - { vendor: api.example.com, address: "0x..." }
