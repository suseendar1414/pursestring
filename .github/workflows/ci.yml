name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pursestring:ci
      - name: Smoke test
        run: |
          if ! out=$(docker run -d --name s -p 8787:8787 pursestring:ci 2>&1); then
            echo "::error::docker run failed: $out"; docker images; exit 1
          fi
          for i in $(seq 1 20); do curl -fs localhost:8787/healthz && exit 0; sleep 1; done
          echo "::error::healthz never answered: $(docker logs s 2>&1 | tail -5 | tr '\n' ' ')"; exit 1
