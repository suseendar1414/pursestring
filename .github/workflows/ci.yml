name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pursestring:ci .
      - name: Smoke test
        run: |
          docker run -d --name s -p 8787:8787 pursestring:ci
          for i in $(seq 1 20); do curl -fs localhost:8787/healthz && exit 0; sleep 1; done
          docker logs s; exit 1
