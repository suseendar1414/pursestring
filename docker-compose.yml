# docker compose up -d
# MCP endpoint: http://localhost:8787/mcp   Health: http://localhost:8787/healthz
services:
  pursestring:
    build: .
    image: pursestring:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PURSESTRING_TOKEN: ${PURSESTRING_TOKEN:-}               # bearer token agents must send to /mcp
      PURSESTRING_ADMIN_TOKEN: ${PURSESTRING_ADMIN_TOKEN:-}   # bearer token for the approve/deny API
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      LITHIC_API_KEY: ${LITHIC_API_KEY:-}               # set to use Lithic sandbox cards instead of the mock rail
      LITHIC_WEBHOOK_SECRET: ${LITHIC_WEBHOOK_SECRET:-} # Lithic ASA HMAC key: real-time authorization at /jit/lithic
      LITHIC_EVENTS_SECRET: ${LITHIC_EVENTS_SECRET:-}   # Lithic event subscription secret: refunds at /webhooks/lithic
      REFUND_WEBHOOK_URL: ${REFUND_WEBHOOK_URL:-}       # your endpoint for signed refund events
      REFUND_WEBHOOK_SECRET: ${REFUND_WEBHOOK_SECRET:-}
    volumes:
      - ./policies.yaml:/config/policies.yaml:ro
      - pursestring-data:/data                              # state.json + decisions.jsonl (the audit log)

volumes:
  pursestring-data:
